name: size
on: [pull_request]
permissions:
  contents: read
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install Yarn
        run: npm install --global yarn@1.22.22 --force
      - run: yarn install --frozen-lockfile
      - run: yarn size
